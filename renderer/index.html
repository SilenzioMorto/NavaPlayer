<header class="titlebar">
  <div class="brand" data-gh-link><img src="logo.svg" alt="" class="logo-sm" id="mark"><b>NAVA</b><span class="beta" data-i18n="beta">Beta</span></div>
  <div class="search" id="searchBox"><svg><use href="#i-search"/></svg><input id="q" type="search" data-i18n-ph="search"></div>
  <div class="tb-actions">
    <button class="ib" id="btnLink" data-i18n-title="tLink"><svg><use href="#i-link"/></svg></button>
    <button class="ib" id="btnGlass" data-i18n-title="tGlass"><svg><use href="#i-glass"/></svg></button>
    <button class="ib" id="btnSide" data-i18n-title="tLibrary"><svg><use href="#i-side"/></svg></button>
    <button class="ib" id="btnTheme" data-i18n-title="tTheme"><svg><use href="#i-palette"/></svg></button>
    <button class="ib" id="btnStage" data-i18n-title="tStage"><svg><use href="#i-stage"/></svg></button>
    <button class="ib" id="btnFull" data-i18n-title="tFull"><svg><use href="#i-expand"/></svg></button>
    <button class="ib" id="btnAppSet" data-i18n-title="tAppSettings"><svg><use href="#i-gear"/></svg></button>
  </div>
</header>

<aside class="side" id="side">
  <nav class="libtabs" id="libTabs">
    <button data-view="songs" data-i18n="vSongs"></button><button data-view="albums" data-i18n="vAlbums"></button><button data-view="artists" data-i18n="vArtists"></button>
    <button data-view="folders" data-i18n="vFolders"></button><button data-view="favs" data-i18n="vFavs"></button><button data-view="queue" data-i18n="vQueue"></button>
  </nav>
  <div class="libbar">
    <span id="libCount" class="muted"></span>
    <div class="chipf" id="filterChip" hidden><span></span><button aria-label="x"><svg><use href="#i-x"/></svg></button></div>
    <select id="sortSel"><option value="title" data-i18n="sortTitle"></option><option value="artist" data-i18n="sortArtist"></option><option value="added" data-i18n="sortAdded"></option><option value="duration" data-i18n="sortDuration"></option><option value="plays" data-i18n="sortPlays"></option></select>
  </div>
  <div class="vlist" id="vlist"><div class="vspace" id="vspace"></div></div>
  <div class="grid" id="grid" hidden></div>
  <footer class="sidefoot">
    <span id="scanInfo" class="muted"></span>
    <div>
      <button class="ib sm" id="btnOpenFiles" data-i18n-title="tOpenFile"><svg><use href="#i-file"/></svg></button>
      <button class="ib sm" id="btnAddFolder" data-i18n-title="tAddFolder"><svg><use href="#i-folder"/></svg></button>
      <button class="ib sm" id="btnRescan" data-i18n-title="tRescan"><svg><use href="#i-refresh"/></svg></button>
    </div>
  </footer>
</aside>

<main class="stage" id="stage">
  <canvas id="gl"></canvas>
  <div class="stage-ui" id="stageUi">
  <nav class="modes" id="modes"></nav>
  <button class="ai-pill" id="aiPill" hidden></button>
  <div class="lyr-menu" id="lyrMenu" hidden>
    <b data-i18n="relang"></b>
    <button data-relang="auto" data-i18n="langAuto"></button><button data-relang="fa" data-i18n="langFa"></button><button data-relang="en" data-i18n="langEn"></button><button data-relang="ru" data-i18n="langRu"></button>
  </div>
  <div class="lyrics" id="lyrics" data-pos="bottom"></div>
  <div class="cover-card" id="coverCard" data-pos="left">
    <div class="cc-art"><img id="ccImg" alt=""><i class="cc-shine"></i></div>
    <div class="cc-meta"><b id="ccTitle" dir="auto"></b><span id="ccArtist" dir="auto"></span><small id="ccAlbum" dir="auto"></small></div>
  </div>
  <div class="embed" id="embed" hidden><div class="embed-top"><span id="embedLabel"></span><button class="ib sm" id="embedClose" data-i18n-title="embedClose"><svg><use href="#i-x"/></svg></button></div><div id="embedBox"></div><p class="embed-note" id="embedNote"></p></div>
  <div class="splash-mode" id="splash"></div>
  <div class="empty" id="empty" hidden>
    <div class="card">
      <h2 data-i18n-html="emptyTitle"></h2>
      <p id="emptyMsg"></p>
      <div class="btnrow"><button class="btn pri" id="emptyAdd"><svg><use href="#i-folder"/></svg><span data-i18n="tAddFolder"></span></button><button class="btn" id="emptyOpen"><svg><use href="#i-file"/></svg><span data-i18n="tOpenFile"></span></button></div>
    </div>
  </div>
  <div class="hello" id="stageHello" hidden>
    <h2 data-i18n="helloTitle"></h2>
    <div class="btnrow"><button class="btn pri" id="helloPlay"><svg><use href="#i-play"/></svg><span data-i18n="helloPlay"></span></button><button class="btn" id="helloShuffle"><svg><use href="#i-shuffle"/></svg><span data-i18n="helloShuffle"></span></button></div>
  </div>
  </div>
  <div class="stagehint"><span><span data-i18n="stageHint"></span> <kbd>H</kbd> / <kbd>Esc</kbd></span><button class="btn sm" id="btnExitStage" data-i18n="exit"></button></div>
</main>

<footer class="dock">
  <div class="track">
    <div class="thumb" id="thumb"></div>
    <div class="meta"><b id="mTitle" dir="auto"></b><span id="mArtist" dir="auto"></span></div>
    <button class="ib sm fav" id="btnFav" data-i18n-title="tFav"><svg><use href="#i-heart"/></svg></button>
  </div>
  <div class="center">
    <div class="transport" dir="ltr">
      <button class="ib bare" id="btnShuffle" data-i18n-title="tShuffle"><svg><use href="#i-shuffle"/></svg></button>
      <button class="ib bare" id="btnPrev" data-i18n-title="tPrev"><svg><use href="#i-prev"/></svg></button>
      <button class="play" id="btnPlay" data-i18n-title="tPlay"><span class="pulse" id="playPulse"></span><svg class="i-play"><use href="#i-play"/></svg><svg class="i-pause"><use href="#i-pause"/></svg></button>
      <button class="ib bare" id="btnNext" data-i18n-title="tNext"><svg><use href="#i-next"/></svg></button>
      <button class="ib bare" id="btnRepeat" data-i18n-title="tRepeat"><svg><use href="#i-repeat"/></svg><span class="badge" id="repBadge" hidden>1</span></button>
    </div>
    <div class="progress" dir="ltr">
      <span class="time" id="tCur">0:00</span>
      <div class="bar" id="bar" role="slider" tabindex="0"><div class="rail"><div class="fill" id="fill"></div></div><div class="knob" id="knob"><i></i></div><div class="tip" id="tip">0:00</div></div>
      <span class="time" id="tDur">0:00</span>
    </div>
  </div>
  <div class="tools">
    <span class="boost-badge" id="boostBadge" hidden data-i18n-title="tBooster"><svg><use href="#i-boost"/></svg></span>
    <button class="ib bare" id="btnLyr" data-i18n-title="tLyrics"><svg><use href="#i-lyr"/></svg></button>
    <button class="ib bare" id="btnEq" data-i18n-title="tEq"><svg><use href="#i-eq"/></svg></button>
    <button class="ib bare" id="btnPlaySet" data-i18n-title="tPlaySettings"><svg><use href="#i-sliders"/></svg></button>
    <div class="vol" dir="ltr"><button class="ib bare" id="btnMute" data-i18n-title="tMute"><svg><use id="volUse" href="#i-vol"/></svg></button><input type="range" id="vol" min="0" max="1" step="0.01"><span class="volpct" id="volPct">85%</span></div>
  </div>
</footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="appSet"><div class="dh"><h2 data-i18n="appSettings"></h2><button class="ib bare" data-close><svg><use href="#i-x"/></svg></button></div><div class="tabs" id="appTabs"></div><div class="dbody" id="appPanes"></div></aside>
<aside class="drawer" id="playSet"><div class="dh"><h2 data-i18n="playSettings"></h2><button class="ib bare" data-close><svg><use href="#i-x"/></svg></button></div><div class="tabs" id="playTabs"></div><div class="dbody" id="playPanes"></div></aside>

<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div class="welcome" id="welcome" hidden><div class="wl-inner"><img src="logo.svg" alt=""><h1 id="wlText"></h1><p><span data-i18n="madeBy"></span> <b>Silenzio Morto</b></p><small data-i18n="tapToSkip"></small></div></div>
<div class="outro" id="outro" hidden><div class="ou-inner"><img src="logo.svg" alt=""><h1 id="ouText"></h1><p>github.com/SilenzioMorto</p></div></div>
<div class="toast" id="toast" role="status"></div>
<div class="drop" id="drop"><div><svg><use href="#i-music"/></svg><span data-i18n="dropHere"></span></div></div>

<script src="i18n.js"></script>
<script src="themes.js"></script>
<script src="presets.js"></script>
<script src="engine.js"></script>
<script src="audiofx.js"></script>
<script src="lyrics.js"></script>
<script src="tour.js"></script>
<script src="app.js"></script>
</body>
